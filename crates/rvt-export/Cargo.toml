[package]
name = "rvt-export"
description = "Writers from the neutral model: triangle meshes, IFC, STEP, DXF and DWG"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rvt-model.workspace = true
rvt-read.workspace = true
earcutr = "0.5"
rvt-core.workspace = true
acadrust = { version = "0.6.6", optional = true, default-features = false }
delaunator = "1"

[features]
default = ["cad"]
cad = ["dep:acadrust"]
