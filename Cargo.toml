[workspace]
resolver = "2"
members = [
    "crates/rvt-core",
    "crates/rvt-model",
    "crates/rvt-read",
    "crates/rvt-export",
    "crates/rvt-ffi",
    "crates/rvt-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rvt-core = { path = "crates/rvt-core" }
rvt-model = { path = "crates/rvt-model" }
rvt-read = { path = "crates/rvt-read" }
rvt-export = { path = "crates/rvt-export", default-features = false }

[profile.release]
lto = "thin"
